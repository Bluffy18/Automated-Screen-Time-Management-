<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Screen Time Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 5px; }
        h2 { font-size: 16px; color: #444; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        p { font-size: 14px; color: #666; }
        .clock-box {
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .clock { font-size: 22px; font-weight: bold; color: #007bff; }
        .input-group {
            margin: 12px 0;
            text-align: left;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #444;
            margin: 10px 0;
        }
        label { font-size: 13px; font-weight: bold; color: #444; }
        input[type="text"], input[type="password"], input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-green { background-color: #28a745; }
        .btn-reset { background-color: #dc3545; }
        .btn-logout { background-color: #6c757d; }
        .link-btn {
            background: none;
            border: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            margin-top: 15px;
            padding: 0;
            width: auto;
        }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        #credStatus, #setupStatus { margin-top: 10px; font-weight: bold; color: #28a745; font-size: 13px; }
        #loginError { color: #dc3545; font-size: 13px; margin-top: 10px; }
        
        #dashboard, #setupCard { display: none; }

        .lock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(220, 53, 69, 0.98);
            color: white;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-overlay h2 { font-size: 26px; margin-bottom: 10px; }
        .lock-overlay p { font-size: 16px; color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lockScreen" class="lock-overlay">
        <h2>🔒 Time's Up!</h2>
        <p>Screen Time Restricted Period Active.</p>
        <p>Please take a break and put away your device.</p>
        <button onclick="emergencyReset()" class="btn-reset" style="width: auto; padding: 10px 20px; margin-top: 15px;">Clear Schedule & Unlock</button>
        <button onclick="logout()" class="btn-logout" style="width: auto; padding: 10px 20px; margin-top: 10px;">Back to Login</button>
    </div>

    <!-- LOGIN CARD -->
    <div id="loginCard" class="container">
        <h1>User Login</h1>
        <p>Access Screen Time Controls</p>

        <div class="input-group">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button onclick="login()">Login</button>
        <p id="loginError"></p>

        <p style="margin-top: 15px; font-size: 13px; color: #666;">
            or <button onclick="showSetup()" class="link-btn">Set-up new profile</button>
        </p>
    </div>

    <!-- SETUP NEW PROFILE CARD -->
    <div id="setupCard" class="container">
        <h1>Set-up New Profile</h1>
        <p>Create credentials for access</p>

        <div class="input-group">
            <label>New Username:</label>
            <input type="text" id="setupUsername" placeholder="Enter new username">
        </div>

        <div class="input-group">
            <label>New Password:</label>
            <input type="password" id="setupPassword" placeholder="Enter new password">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="saveProfileCheck" checked>
            <label for="saveProfileCheck">Save username and password in browser</label>
        </div>

        <button onclick="registerProfile()" class="btn-green">Create Profile</button>
        <p id="setupStatus"></p>

        <button onclick="showLogin()" class="btn-logout">Back to Login</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="container">
        <h1>Screen Time Manager</h1>
        <p>Set your restricted screen time window.</p>

        <div class="clock-box">
            <small>Current Time:</small>
            <div id="currentTime" class="clock">00:00:00</div>
        </div>

        <div class="input-group">
            <label for="startTime">Lock Start Time:</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">Lock End Time (Power On/Unlock):</label>
            <input type="time" id="endTime">
        </div>

        <button onclick="saveSchedule()">Save Schedule</button>
        <button onclick="clearSchedule()" class="btn-reset">Clear Schedule</button>

        <!-- ACCOUNT SETTINGS -->
        <h2>Account Settings</h2>
        <div class="input-group">
            <label>Update Username:</label>
            <input type="text" id="newUsername" placeholder="Enter new username">
        </div>

        <div class="input-group">
            <label>Update Password:</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="saveCredentialsCheck" checked>
            <label for="saveCredentialsCheck">Save username and password in browser</label>
        </div>

        <button onclick="updateCredentials()" class="btn-green">Update Credentials</button>
        <p id="credStatus"></p>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <button onclick="logout()" class="btn-logout">Logout</button>

        <p id="status"></p>
    </div>

    <script>
        window.onload = function() {
            sessionStorage.setItem('isLoggedIn', 'false');
            showLogin();
            updateClock();
        };

        function showLogin() {
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
        }

        function showSetup() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('setupCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const validUser = localStorage.getItem('appUsername') || sessionStorage.getItem('tempUsername') || 'admin';
            const validPass = localStorage.getItem('appPassword') || sessionStorage.getItem('tempPassword') || '1234';

            if (user === validUser && pass === validPass) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password!';
            }
        }

        function registerProfile() {
            const newUser = document.getElementById('setupUsername').value;
            const newPass = document.getElementById('setupPassword').value;
            const shouldSave = document.getElementById('saveProfileCheck').checked;

            if (!newUser || !newPass) {
                alert('Please enter both username and password!');
                return;
            }

            if (shouldSave) {
                localStorage.setItem('appUsername', newUser);
                localStorage.setItem('appPassword', newPass);
                sessionStorage.removeItem('tempUsername');
                sessionStorage.removeItem('tempPassword');
                document.getElementById('setupStatus').innerText = 'Profile saved permanently! You can now login.';
            } else {
                sessionStorage.setItem('tempUsername', newUser);
                sessionStorage.setItem('tempPassword', newPass);
                localStorage.removeItem('appUsername');
                localStorage.removeItem('appPassword');
                document.getElementById('setupStatus').innerText = 'Temporary profile created! (Active for this session only)';
            }

            document.getElementById('setupUsername').value = '';
            document.getElementById('setupPassword').value = '';

            setTimeout(() => {
                document.getElementById('setupStatus').innerText = '';
                showLogin();
            }, 1500);
        }

        function updateCredentials() {
            const newUser = document.getElementById('newUsername').value;
            const newPass = document.getElementById('newPassword').value;
            const shouldSave = document.getElementById('saveCredentialsCheck').checked;

            if (!newUser || !newPass) {
                alert('Please enter both new username and password!');
                return;
            }

            if (shouldSave) {
                localStorage.setItem('appUsername', newUser);
                localStorage.setItem('appPassword', newPass);
                sessionStorage.removeItem('tempUsername');
                sessionStorage.removeItem('tempPassword');
                document.getElementById('credStatus').innerText = 'Credentials saved permanently!';
            } else {
                sessionStorage.setItem('tempUsername', newUser);
                sessionStorage.setItem('tempPassword', newPass);
                localStorage.removeItem('appUsername');
                localStorage.removeItem('appPassword');
                document.getElementById('credStatus').innerText = 'Credentials updated for session only (Not Saved)!';
            }

            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
        }

        function logout() {
            sessionStorage.setItem('isLoggedIn', 'false');
            showLogin();
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').innerText = '';
        }

        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            const savedStart = localStorage.getItem('startTime');
            const savedEnd = localStorage.getItem('endTime');

            if (savedStart && savedEnd) {
                document.getElementById('startTime').value = savedStart;
                document.getElementById('endTime').value = savedEnd;
                document.getElementById('status').innerText = `Restricted schedule: ${savedStart} - ${savedEnd}`;
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString();

            const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
            const startScheduleTime = localStorage.getItem('startTime');
            const endScheduleTime = localStorage.getItem('endTime');

            if (isLoggedIn && startScheduleTime && endScheduleTime) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                const [startHours, startMins] = startScheduleTime.split(':').map(Number);
                const startMinutes = startHours * 60 + startMins;

                const [endHours, endMins] = endScheduleTime.split(':').map(Number);
                const endMinutes = endHours * 60 + endMins;

                let isLocked = false;

                // Same-day restriction (Halimbawa: 1:00 AM hanggang 1:54 AM)
                if (startMinutes < endMinutes) {
                    if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                        isLocked = true;
                    }
                } 
                // Overnight restriction (Halimbawa: 10:00 PM hanggang 6:00 AM)
                else {
                    if (currentMinutes >= startMinutes || currentMinutes < endMinutes) {
                        isLocked = true;
                    }
                }

                if (isLocked) {
                    document.getElementById('lockScreen').style.display = 'flex';
                } else {
                    document.getElementById('lockScreen').style.display = 'none';
                }
            } else {
                document.getElementById('lockScreen').style.display = 'none';
            }
        }

        setInterval(updateClock, 1000);

        function saveSchedule() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) {
                alert('Please select both lock start and lock end times!');
                return;
            }

            localStorage.setItem('startTime', start);
            localStorage.setItem('endTime', end);

            document.getElementById('status').innerText = `Restricted window active: ${start} to ${end}`;
            updateClock();
        }

        function clearSchedule() {
            localStorage.removeItem('startTime');
            localStorage.removeItem('endTime');
            if (document.getElementById('startTime')) document.getElementById('startTime').value = '';
            if (document.getElementById('endTime')) document.getElementById('endTime').value = '';
            if (document.getElementById('status')) document.getElementById('status').innerText = 'Schedule cleared.';
            updateClock();
        }

        function emergencyReset() {
            clearSchedule();
            logout();
        }
    </script>

</body>
</html>
