<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Screen Time Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            position: relative;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 5px; }
        p { font-size: 14px; color: #666; }
        .clock-box {
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .clock { font-size: 22px; font-weight: bold; color: #007bff; }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label { font-size: 14px; font-weight: bold; color: #444; }
        input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
        }
        /* Overlay kapag naabot na ang screen time limit */
        .lock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(220, 53, 69, 0.95);
            color: white;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-overlay h2 { font-size: 26px; margin-bottom: 10px; }
        .lock-overlay p { font-size: 16px; color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- Full Screen Lock Message -->
    <div id="lockScreen" class="lock-overlay">
        <h2>🔒 Time's Up!</h2>
        <p>Screen Time Limit Reached.</p>
        <p>Please take a break and put away your device.</p>
    </div>

    <div class="container">
        <h1>Screen Time Manager</h1>
        <p>Set your daily device schedule.</p>

        <div class="clock-box">
            <small>Current Time:</small>
            <div id="currentTime" class="clock">00:00:00</div>
        </div>

        <div class="input-group">
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">End Time:</label>
            <input type="time" id="endTime">
        </div>

        <button onclick="saveSchedule()">Save Schedule</button>

        <p id="status"></p>
    </div>

    <script>
        let endScheduleTime = null;

        // Real-time clock checker
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('currentTime').innerText = timeString;

            // Check if limit is reached
            if (endScheduleTime) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const [endHours, endMins] = endScheduleTime.split(':').map(Number);
                const endMinutes = endHours * 60 + endMins;

                if (currentMinutes >= endMinutes) {
                    document.getElementById('lockScreen').style.display = 'flex';
                } else {
                    document.getElementById('lockScreen').style.display = 'none';
                }
            }
        }

        setInterval(updateClock, 1000);

        function saveSchedule() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) {
                alert('Please select both start and end times!');
                return;
            }

            endScheduleTime = end;
            document.getElementById('status').innerText = `Schedule active until ${end}`;
            updateClock();
        }
    </script>

</body>
</html>
