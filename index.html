<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Screen Time Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 5px; }
        p { font-size: 14px; color: #666; }
        .clock-box {
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .clock { font-size: 22px; font-weight: bold; color: #007bff; }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label { font-size: 14px; font-weight: bold; color: #444; }
        input[type="text"], input[type="password"], input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-reset { background-color: #dc3545; }
        .btn-logout { background-color: #6c757d; }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        #loginError { color: #dc3545; font-size: 13px; margin-top: 10px; }
        
        /* Dashboard default hidden */
        #dashboard { display: none; }

        /* Lock Screen Overlay */
        .lock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(220, 53, 69, 0.95);
            color: white;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-overlay h2 { font-size: 26px; margin-bottom: 10px; }
        .lock-overlay p { font-size: 16px; color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- Full Screen Lock Message -->
    <div id="lockScreen" class="lock-overlay">
        <h2>🔒 Time's Up!</h2>
        <p>Screen Time Limit Reached.</p>
        <p>Please take a break and put away your device.</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginCard" class="container">
        <h1>User Login</h1>
        <p>Access Screen Time Controls</p>

        <div class="input-group">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button onclick="login()">Login</button>
        <p id="loginError"></p>
        <p><small>Default: <b>admin</b> / Pass: <b>1234</b></small></p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="container">
        <h1>Screen Time Manager</h1>
        <p>Set your daily device schedule.</p>

        <div class="clock-box">
            <small>Current Time:</small>
            <div id="currentTime" class="clock">00:00:00</div>
        </div>

        <div class="input-group">
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">End Time:</label>
            <input type="time" id="endTime">
        </div>

        <button onclick="saveSchedule()">Save Schedule</button>
        <button onclick="clearSchedule()" class="btn-reset">Clear Schedule</button>
        <button onclick="logout()" class="btn-logout">Logout</button>

        <p id="status"></p>
    </div>

    <script>
        // Check session on startup
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showDashboard();
            }
            updateClock();
        };

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Simple demo account
            if (user === 'admin' && pass === '1234') {
                sessionStorage.setItem('isLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password!';
            }
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            const savedStart = localStorage.getItem('startTime');
            const savedEnd = localStorage.getItem('endTime');

            if (savedStart && savedEnd) {
                document.getElementById('startTime').value = savedStart;
                document.getElementById('endTime').value = savedEnd;
                document.getElementById('status').innerText = `Saved schedule: ${savedStart} - ${savedEnd}`;
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString();

            const endScheduleTime = localStorage.getItem('endTime');

            if (endScheduleTime) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const [endHours, endMins] = endScheduleTime.split(':').map(Number);
                const endMinutes = endHours * 60 + endMins;

                if (currentMinutes >= endMinutes) {
                    document.getElementById('lockScreen').style.display = 'flex';
                } else {
                    document.getElementById('lockScreen').style.display = 'none';
                }
            } else {
                document.getElementById('lockScreen').style.display = 'none';
            }
        }

        setInterval(updateClock, 1000);

        function saveSchedule() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) {
                alert('Please select both start and end times!');
                return;
            }

            localStorage.setItem('startTime', start);
            localStorage.setItem('endTime', end);

            document.getElementById('status').innerText = `Schedule active until ${end}`;
            updateClock();
        }

        function clearSchedule() {
            localStorage.removeItem('startTime');
            localStorage.removeItem('endTime');
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            document.getElementById('status').innerText = 'Schedule cleared.';
            updateClock();
        }
    </script>

</body>
</html>
