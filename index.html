<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Screen Time Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 5px; }
        h2 { font-size: 16px; color: #444; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        p { font-size: 14px; color: #666; }
        .clock-box {
            background: #eef2f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .clock { font-size: 22px; font-weight: bold; color: #007bff; }
        .input-group {
            margin: 12px 0;
            text-align: left;
        }
        label { font-size: 13px; font-weight: bold; color: #444; }
        input[type="text"], input[type="password"], input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-green { background-color: #28a745; }
        .btn-reset { background-color: #dc3545; }
        .btn-logout { background-color: #6c757d; }
        .otp-box {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
            display: none;
        }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        #loginError { color: #dc3545; font-size: 13px; margin-top: 10px; }
        
        #dashboard, #otpSection { display: none; }

        .lock-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(220, 53, 69, 0.98);
            color: white;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .lock-overlay h2 { font-size: 26px; margin-bottom: 10px; }
        .lock-overlay p { font-size: 16px; color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN OVERLAY -->
    <div id="lockScreen" class="lock-overlay">
        <h2>🔒 Time's Up!</h2>
        <p>Screen Time Restricted Period Active.</p>
        <p>Please take a break and put away your device.</p>
        <button onclick="emergencyReset()" class="btn-reset" style="width: auto; padding: 10px 20px; margin-top: 15px;">Clear Schedule & Unlock</button>
        <button onclick="logout()" class="btn-logout" style="width: auto; padding: 10px 20px; margin-top: 10px;">Logout</button>
    </div>

    <!-- AUTHENTICATION CARD (LOGIN & OTP) -->
    <div id="authCard" class="container">
        <h1>User Verification</h1>
        <p>Enter Gmail or Phone Number to access</p>

        <!-- STEP 1: Enter Contact Info -->
        <div id="contactSection">
            <div class="input-group">
                <label>Gmail or Phone Number:</label>
                <input type="text" id="contactInput" placeholder="e.g. user@gmail.com / 09123456789">
            </div>
            <button onclick="sendOTP()" class="btn-green">Send OTP Code</button>
        </div>

        <!-- SIMULATED OTP NOTIFICATION -->
        <div id="otpDisplayBox" class="otp-box">
            System OTP Code: <span id="generatedOTP">------</span>
        </div>

        <!-- STEP 2: Enter OTP -->
        <div id="otpSection">
            <div class="input-group">
                <label>Enter 6-Digit OTP:</label>
                <input type="text" id="otpInput" placeholder="Enter 6-digit code">
            </div>
            <button onclick="verifyOTP()">Verify & Access System</button>
        </div>

        <p id="loginError"></p>
    </div>

    <!-- MAIN HOME / DASHBOARD -->
    <div id="dashboard" class="container">
        <h1>Screen Time Manager</h1>
        <p>Set your restricted screen time window.</p>

        <div class="clock-box">
            <small>Current Time:</small>
            <div id="currentTime" class="clock">00:00:00</div>
        </div>

        <div class="input-group">
            <label for="startTime">Lock Start Time:</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">Lock End Time (Power On/Unlock):</label>
            <input type="time" id="endTime">
        </div>

        <button onclick="saveSchedule()">Save Schedule</button>
        <button onclick="clearSchedule()" class="btn-reset">Clear Schedule</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <button onclick="logout()" class="btn-logout">Logout System</button>

        <p id="status"></p>
    </div>

    <script>
        let currentGeneratedOTP = null;

        window.onload = function() {
            // Tinitignan kung naka-login na dati ang user sa browser
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

            if (isLoggedIn) {
                showDashboard();
            } else {
                showAuth();
            }

            updateClock();
        };

        function showAuth() {
            document.getElementById('authCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('contactSection').style.display = 'block';
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('otpDisplayBox').style.display = 'none';
        }

        function sendOTP() {
            const contact = document.getElementById('contactInput').value.trim();

            if (!contact) {
                document.getElementById('loginError').innerText = 'Please enter a valid Gmail or Phone number!';
                return;
            }

            // Gumawa ng random 6-digit OTP code
            currentGeneratedOTP = Math.floor(100000 + Math.random() * 900000).toString();

            // Ipakita ang simulated OTP sa screen (para sa testing)
            document.getElementById('generatedOTP').innerText = currentGeneratedOTP;
            document.getElementById('otpDisplayBox').style.display = 'block';

            document.getElementById('contactSection').style.display = 'none';
            document.getElementById('otpSection').style.display = 'block';
            document.getElementById('loginError').innerText = '';
        }

        function verifyOTP() {
            const userOTP = document.getElementById('otpInput').value.trim();

            if (userOTP === currentGeneratedOTP) {
                // I-save sa localStorage para manatiling logged in kahit i-close ang browser
                localStorage.setItem('isLoggedIn', 'true');
                document.getElementById('loginError').innerText = '';
                showDashboard();
            } else {
                document.getElementById('loginError').innerText = 'Invalid OTP Code. Please try again.';
            }
        }

        function logout() {
            // Tatanggalin ang login status para hingian ulit ng OTP
            localStorage.setItem('isLoggedIn', 'false');
            document.getElementById('contactInput').value = '';
            document.getElementById('otpInput').value = '';
            showAuth();
        }

        function showDashboard() {
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            const savedStart = localStorage.getItem('startTime');
            const savedEnd = localStorage.getItem('endTime');

            if (savedStart && savedEnd) {
                document.getElementById('startTime').value = savedStart;
                document.getElementById('endTime').value = savedEnd;
                document.getElementById('status').innerText = `Restricted schedule: ${savedStart} - ${savedEnd}`;
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString();

            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const startScheduleTime = localStorage.getItem('startTime');
            const endScheduleTime = localStorage.getItem('endTime');

            if (isLoggedIn && startScheduleTime && endScheduleTime) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();

                const [startHours, startMins] = startScheduleTime.split(':').map(Number);
                const startMinutes = startHours * 60 + startMins;

                const [endHours, endMins] = endScheduleTime.split(':').map(Number);
                const endMinutes = endHours * 60 + endMins;

                let isLocked = false;

                if (startMinutes < endMinutes) {
                    if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                        isLocked = true;
                    }
                } else {
                    if (currentMinutes >= startMinutes || currentMinutes < endMinutes) {
                        isLocked = true;
                    }
                }

                if (isLocked) {
                    document.getElementById('lockScreen').style.display = 'flex';
                } else {
                    document.getElementById('lockScreen').style.display = 'none';
                }
            } else {
                document.getElementById('lockScreen').style.display = 'none';
            }
        }

        setInterval(updateClock, 1000);

        function saveSchedule() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) {
                alert('Please select both lock start and lock end times!');
                return;
            }

            localStorage.setItem('startTime', start);
            localStorage.setItem('endTime', end);

            document.getElementById('status').innerText = `Restricted window active: ${start} to ${end}`;
            updateClock();
        }

        function clearSchedule() {
            localStorage.removeItem('startTime');
            localStorage.removeItem('endTime');
            if (document.getElementById('startTime')) document.getElementById('startTime').value = '';
            if (document.getElementById('endTime')) document.getElementById('endTime').value = '';
            if (document.getElementById('status')) document.getElementById('status').innerText = 'Schedule cleared.';
            updateClock();
        }

        function emergencyReset() {
            clearSchedule();
            logout();
        }
    </script>

</body>
</html>
