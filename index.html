<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Screen Time Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 { font-size: 20px; color: #333; }
        p { font-size: 14px; color: #666; }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label { font-size: 14px; font-weight: bold; color: #444; }
        input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Screen Time Manager</h1>
        <p>Set your daily device schedule.</p>

        <div class="input-group">
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime">
        </div>

        <div class="input-group">
            <label for="endTime">End Time:</label>
            <input type="time" id="endTime">
        </div>

        <button onclick="saveSchedule()">Save Schedule</button>

        <p id="status"></p>
    </div>

    <script>
        function saveSchedule() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            
            if (!start || !end) {
                alert('Please select both start and end times!');
                return;
            }

            document.getElementById('status').innerText = `Schedule set from ${start} to ${end}`;
        }
    </script>

</body>
</html>
